# Translations the catalog publishes. Every entry is reviewed by hand:
#
# - The licence comes from the translation's copr.htm on eBible.org, not from
#   translations.csv (whose Copyright field does not name the licence).
# - Only licences that allow redistribution of converted text: public domain,
#   CC0, CC BY, CC BY-SA. Never "no derivatives".
# - `versification` lists where the text's verse numbers differ from the KJV,
#   in Paratext mapping syntax, translation side first; `none` means no KJV
#   counterpart. Each line must be checked against both texts. The build
#   refuses a text whose numbering still differs from the KJV.
#
# Optional keys override translations.csv: name, language_name.

[[translation]]
id = "engbsb"
abbreviation = "BSB"
licence = "Public Domain"
attribution = "Berean Standard Bible by BSB Publishing, courtesy of eBible.org."
reviewed = "2026-11-20"

